# Vite web dashboard — separate from the main CI workflow so a broken web build
# never blocks merging or releasing the Expo mobile app. Only runs when files
# under the web app change; configure branch protection on `release` to require
# the jobs from `ci.yml` only (Mobile, Functions, Firestore rules), not this one.
name: CI Web

on:
  pull_request:
    branches: [main, release]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "index.html"
      - "eslint.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/ci-web.yml"
  push:
    branches: [main, release]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "index.html"
      - "eslint.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web (Vite) lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
