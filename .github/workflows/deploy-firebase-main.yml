name: Deploy Firebase (Hosting + Functions)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - "package.json"
      - "package-lock.json"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - "index.html"
      - ".github/workflows/deploy-firebase-main.yml"
  workflow_dispatch: {}

concurrency:
  group: deploy-firebase-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Firebase service account secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT_AURORA_44941 }}" ]; then
            echo "::error::Add repo secret FIREBASE_SERVICE_ACCOUNT_AURORA_44941 (JSON key) under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Write service account JSON
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AURORA_44941 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build web
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_EMOTION_API_URL: ${{ secrets.VITE_EMOTION_API_URL }}
        run: npm run build

      - name: Deploy Hosting and Cloud Functions
        run: |
          npx --yes firebase-tools@latest deploy \
            --only hosting,functions \
            --non-interactive \
            --message "ci: main ${GITHUB_SHA::7}"